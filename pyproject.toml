[project]
name = "0xclaw"
version = "0.1.0"
description = "Autonomous Hackathon Agent — UK AI Agent Hackathon EP4 x OpenClaw"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "0xClaw Team"}
]
keywords = ["ai", "agent", "hackathon", "openclaw", "nanobot"]

dependencies = [
    "nanobot-ai>=0.1.4",
    "anyway-sdk>=0.0.6",
    "prompt-toolkit>=3.0.50,<4.0.0",
    "rich>=14.0.0,<15.0.0",
    "loguru>=0.7.3,<1.0.0",
    "openai>=1.50.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
sponsors = [
    "virtuals-sdk>=0.1.0",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
0xclaw = "claw.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["0xclaw", "claw"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
